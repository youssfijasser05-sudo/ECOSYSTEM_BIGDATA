filebeat.inputs:
  - type: filestream
    id: nginx-access
    paths: [/var/log/web01/nginx/access.log]
    fields: { log_type: nginx_access }
  - type: filestream
    id: nginx-error
    paths: [/var/log/web01/nginx/error.log]
    fields: { log_type: nginx_error }
  - type: filestream
    id: auth
    paths: [/var/log/web01/auth.log]
    fields: { log_type: auth }
  - type: filestream
    id: syslog
    paths: [/var/log/web01/syslog]
    include_lines: ['(?i)error', '(?i)fail', '(?i)critical', '(?i)denied']
    fields: { log_type: syslog }

output.logstash:
  hosts: ["logstash:5044"]

logging.level: info
