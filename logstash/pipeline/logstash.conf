# =====================================================================
#  Pipeline Logstash - normalisation des logs Linux (web01) et Windows (dc01)
# =====================================================================
input {
  beats { port => 5044  tags => ["src_linux"] }     # Filebeat  (web01)
  beats { port => 5045  tags => ["src_windows"] }   # Winlogbeat (dc01)
}

filter {
  # ===================== LINUX : web01 =====================
  if "src_linux" in [tags] {
    mutate {
      add_field => { "systeme" => "linux"  "log_type" => "%{[fields][log_type]}" }
      copy      => { "[host][name]" => "[@metadata][host]" }
    }

    # ---------- Nginx : journal d'accès ----------
    if [log_type] == "nginx_access" {
      grok {
        match => { "message" => '^%{IPORHOST:[@metadata][ip]} - %{DATA:[@metadata][user]} \[%{HTTPDATE:[@metadata][ts]}\] "(?:%{WORD:[@metadata][method]} %{NOTSPACE:[@metadata][url]}(?: HTTP/%{NUMBER})?|%{DATA})" %{NUMBER:[@metadata][status]:int} (?:%{NUMBER}|-)' }
      }
      date { match => ["[@metadata][ts]", "dd/MMM/yyyy:HH:mm:ss Z"]  locale => "en" }
      mutate { add_field => { "source" => "nginx"  "categorie" => "web" } }
      if [@metadata][status] {
        mutate { add_field => { "http_status" => "%{[@metadata][status]}"  "http_url" => "%{[@metadata][url]}"  "http_method" => "%{[@metadata][method]}" } }
        if [@metadata][status] >= 500 {
          mutate { add_field => { "type_evenement" => "http_error_5xx"  "severite" => "elevee"  "resultat" => "echec" } }
        } else if [@metadata][status] >= 400 {
          mutate { add_field => { "type_evenement" => "http_error_4xx"  "severite" => "moyenne" "resultat" => "echec" } }
        } else {
          mutate { add_field => { "type_evenement" => "http_access"     "severite" => "faible"  "resultat" => "succes" } }
        }
      }

    # ---------- Nginx : journal d'erreurs ----------
    } else if [log_type] == "nginx_error" {
      grok { match => { "message" => "^%{DATA:[@metadata][ts]} \[%{LOGLEVEL:[@metadata][lvl]}\] %{GREEDYDATA:[@metadata][msg]}" } }
      grok { match => { "message" => "client: %{IP:[@metadata][ip]}" }  tag_on_failure => [] }
      date { match => ["[@metadata][ts]", "yyyy/MM/dd HH:mm:ss"]  timezone => "Africa/Tunis" }
      mutate { add_field => { "source" => "nginx"  "categorie" => "web"  "type_evenement" => "nginx_error" } }
      if [@metadata][lvl] in ["emerg", "alert", "crit"] { mutate { add_field => { "severite" => "elevee" } } }
      else if [@metadata][lvl] == "error"                { mutate { add_field => { "severite" => "moyenne" } } }
      else                                               { mutate { add_field => { "severite" => "faible" } } }

    # ---------- auth.log et syslog (format : date ISO, machine, programme[pid]: texte) ----------
    } else if [log_type] in ["auth", "syslog"] {
      grok { match => { "message" => "^%{TIMESTAMP_ISO8601:[@metadata][ts]} %{SYSLOGHOST} %{DATA:[@metadata][prog]}(?:\[%{POSINT}\])?: %{GREEDYDATA:[@metadata][msg]}" } }
      date { match => ["[@metadata][ts]", "ISO8601"] }

      if [@metadata][prog] == "sshd" {
        mutate { add_field => { "source" => "ssh"  "categorie" => "authentification" } }
        grok {
          match => { "[@metadata][msg]" => [
            "^Failed password for invalid user %{NOTSPACE:[@metadata][user]} from %{IP:[@metadata][ip]}",
            "^Failed password for %{NOTSPACE:[@metadata][user]} from %{IP:[@metadata][ip]}",
            "^Invalid user %{NOTSPACE:[@metadata][user]} from %{IP:[@metadata][ip]}",
            "^Accepted %{WORD} for %{NOTSPACE:[@metadata][user]} from %{IP:[@metadata][ip]}"
          ] }
          tag_on_failure => []
        }
        if [@metadata][msg] =~ /^Failed password/   { mutate { add_field => { "type_evenement" => "ssh_failed_password" "severite" => "moyenne" "resultat" => "echec" } } }
        else if [@metadata][msg] =~ /^Invalid user/ { mutate { add_field => { "type_evenement" => "ssh_invalid_user"    "severite" => "moyenne" "resultat" => "echec" } } }
        else if [@metadata][msg] =~ /^Accepted/     { mutate { add_field => { "type_evenement" => "ssh_success"         "severite" => "faible"  "resultat" => "succes" } } }
        else                                         { mutate { add_field => { "type_evenement" => "ssh_other"           "severite" => "faible" } } }

      } else if [@metadata][prog] == "sudo" {
        grok { match => { "[@metadata][msg]" => "^\s*%{USERNAME:[@metadata][user]} :" }  tag_on_failure => [] }
        mutate { add_field => { "source" => "sudo"  "categorie" => "privilege"  "type_evenement" => "sudo_command"  "severite" => "faible" } }

      } else {
        mutate { add_field => { "source" => "system"  "categorie" => "systeme"  "type_evenement" => "system_event" } }
        if [@metadata][msg] =~ /(?i)(critical|fatal|panic)/ { mutate { add_field => { "severite" => "elevee" } } }
        else if [@metadata][msg] =~ /(?i)(error|fail)/      { mutate { add_field => { "severite" => "moyenne" } } }
        else                                                 { mutate { add_field => { "severite" => "faible" } } }
      }
    }
  }

  # ===================== WINDOWS : dc01 =====================
  if "src_windows" in [tags] {
    mutate {
      add_field => { "systeme" => "windows"  "log_type" => "winlog_%{[winlog][channel]}"  "event_id" => "%{[winlog][event_id]}" }
      copy      => { "[host][name]" => "[@metadata][host]"
                     "[winlog][event_data][TargetUserName]" => "[@metadata][user]"
                     "[winlog][event_data][IpAddress]"      => "[@metadata][ip]" }
    }
    mutate { gsub => ["[@metadata][ip]", "^::ffff:", ""] }      # IPv4 encapsulée en IPv6 -> IPv4
    if ![@metadata][user] { mutate { copy => { "[winlog][event_data][SubjectUserName]" => "[@metadata][user]" } } }
    if [@metadata][ip] == "-" { mutate { remove_field => ["[@metadata][ip]"] } }

    # Bruit : comptes machine (se terminent par $, ex. DC01$) -> ignorés
    if [@metadata][user] =~ /\$$/ { drop {} }

    # Message : on ne garde que la première ligne du texte (le résumé)
    ruby { code => 'm = event.get("message"); event.set("message", m.to_s.split("\n").first) if m' }

    if [winlog][channel] == "Security" {
      mutate { add_field => { "source" => "active_directory" } }
      ruby {
        code => '
          id = event.get("[winlog][event_id]").to_s
          # ID => [categorie, type_evenement, severite, resultat]
          table = {
            "4624" => ["authentification", "auth_success",            "faible",  "succes"],
            "4625" => ["authentification", "auth_failure",            "moyenne", "echec"],
            "4768" => ["authentification", "kerberos_tgt_request",    "faible",  nil],
            "4771" => ["authentification", "kerberos_preauth_failed", "moyenne", "echec"],
            "4776" => ["authentification", "ntlm_validation",         "faible",  nil],
            "4672" => ["privilege",        "privileged_logon",        "faible",  "succes"],
            "4740" => ["compte",           "account_locked",          "elevee",  "echec"],
            "4767" => ["compte",           "account_unlocked",        "moyenne", "succes"],
            "4720" => ["compte",           "account_created",         "moyenne", "succes"],
            "4722" => ["compte",           "account_enabled",         "faible",  "succes"],
            "4725" => ["compte",           "account_disabled",        "moyenne", "succes"],
            "4726" => ["compte",           "account_deleted",         "moyenne", "succes"],
            "4728" => ["compte",           "group_member_added",      "moyenne", "succes"],
            "4732" => ["compte",           "group_member_added",      "moyenne", "succes"]
          }
          c = table[id] || ["securite", "windows_security_" + id, "faible", nil]
          event.set("categorie", c[0]); event.set("type_evenement", c[1]); event.set("severite", c[2])
          if c[3]
            event.set("resultat", c[3])
          else
            # 4768 / 4776 : le code Status indique la réussite (0x0) ou l échec
            st = event.get("[winlog][event_data][Status]").to_s.downcase
            ok = ["", "0x0", "0x00000000"].include?(st)
            event.set("resultat", ok ? "succes" : "echec")
            event.set("severite", "moyenne") unless ok
          end
        '
      }
    } else {
      # Journal Système : erreurs et avertissements (niveau en français ou en anglais)
      mutate { add_field => { "source" => "windows_system"  "categorie" => "systeme"  "type_evenement" => "system_%{[winlog][event_id]}" } }
      if [log][level] =~ /(?i)crit/   { mutate { add_field => { "severite" => "elevee" } } }
      else if [log][level] =~ /(?i)err/ { mutate { add_field => { "severite" => "moyenne" } } }
      else                              { mutate { add_field => { "severite" => "faible" } } }
    }
  }

  # ===================== COMMUN : schéma final =====================
  mutate { remove_field => ["host"] }                                  # on remplace l'objet host par un simple texte
  mutate { add_field => { "host" => "%{[@metadata][host]}" } }
  mutate { gsub => ["host", "\.isetlab\.lan$", ""]  lowercase => ["host"] }   # dc01.isetlab.lan -> dc01

  if [@metadata][user] and [@metadata][user] != "-" { mutate { add_field => { "utilisateur" => "%{[@metadata][user]}" } } }
  if [@metadata][ip]                                { mutate { add_field => { "adresse_ip"  => "%{[@metadata][ip]}" } } }
  if ![source]   { mutate { add_field => { "source"   => "inconnu" } } }
  if ![severite] { mutate { add_field => { "severite" => "faible" } } }

  mutate { add_field => { "timestamp" => "%{@timestamp}" } }           # date ISO 8601 (UTC)

  # Empreinte unique de l'événement : permettra à Spark de supprimer les doublons
  fingerprint { source => ["host", "timestamp", "message"]  concatenate_sources => true  method => "SHA1"  target => "id_evenement" }

  # On ne garde que les champs du schéma commun
  prune {
    whitelist_names => [ "^@timestamp$", "^timestamp$", "^source$", "^host$", "^systeme$", "^type_evenement$",
                         "^utilisateur$", "^adresse_ip$", "^message$", "^severite$", "^categorie$", "^resultat$",
                         "^event_id$", "^http_status$", "^http_url$", "^http_method$", "^log_type$",
                         "^id_evenement$", "^tags$" ]
  }
}

# Sortie : publication des événements normalisés (JSON) dans le topic Kafka
output {
  kafka {
    bootstrap_servers => "kafka:9092"
    topic_id          => "security-logs"
    codec             => json
    message_key       => "%{host}"      # même machine -> même partition (ordre conservé par hôte)
  }
}
